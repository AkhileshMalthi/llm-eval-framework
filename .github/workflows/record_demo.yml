name: Record Demo GIF

on:
  # Manual trigger
  workflow_dispatch:
  # Trigger on changes to demo-related files
  push:
    branches: [main]
    paths:
      - 'demo/demo.tape'
      - 'src/**'
      - 'examples/**'

jobs:
  record:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install project dependencies
        run: |
          pip install -e .
          # Download NLTK data required for BLEU metric
          python -c "import nltk; nltk.download('punkt_tab', quiet=True)"

      - name: Create results directory
        run: mkdir -p results docs/assets

      - name: Install VHS and dependencies
        run: |
          # Install ffmpeg and Fira Code font
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-firacode
          
          # Install ttyd from GitHub releases
          sudo wget -q https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 -O /usr/local/bin/ttyd
          sudo chmod +x /usr/local/bin/ttyd
          
          # Install VHS from Charm apt repository
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | sudo tee /etc/apt/sources.list.d/charm.list
          sudo apt-get update
          sudo apt-get install -y vhs

      - name: Record demo with VHS
        run: vhs demo/demo.tape

      - name: Upload demo GIF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-gif
          path: docs/assets/demo.mp4
          retention-days: 30

      - name: Commit and push updated GIF
        # Only commit on main branch pushes, not PRs
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/assets/demo.mp4
          git diff --staged --quiet || git commit -m "docs: update demo GIF [skip ci]"
          git push
