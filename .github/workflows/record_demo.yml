name: Record Demo GIF

on:
  # Manual trigger
  workflow_dispatch:
  # Trigger on changes to demo-related files
  push:
    branches: [main]
    paths:
      - 'demo/demo.tape'
      - 'src/**'
      - 'examples/**'

jobs:
  record:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install project dependencies
        run: |
          pip install -e .
          # Download NLTK data required for BLEU metric
          python -c "import nltk; nltk.download('punkt_tab', quiet=True)"

      - name: Create results directory
        run: mkdir -p results docs/assets

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Record demo with VHS
        uses: charmbracelet/vhs-action@v2
        with:
          path: 'demo/demo.tape'
          version: '0.7.2'

      - name: Upload demo GIF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-gif
          path: docs/assets/demo.gif
          retention-days: 30

      - name: Commit and push updated GIF
        # Only commit on main branch pushes, not PRs
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/assets/demo.gif
          git diff --staged --quiet || git commit -m "docs: update demo GIF [skip ci]"
          git push
