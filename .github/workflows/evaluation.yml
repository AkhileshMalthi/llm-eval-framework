name: LLM Evaluation Framework CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.13"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: |
        poetry install --with dev
    
    - name: Download NLTK data
      run: |
        poetry run python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab')"
    
    - name: Verify CLI tool accessibility
      run: |
        poetry run llm-eval --help
        echo "✅ CLI tool is accessible"
    
    - name: Run linting
      run: |
        poetry run python -m pip install ruff
        poetry run ruff check src/ tests/ || true
    
    - name: Run tests with coverage
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        poetry run pytest tests/ --cov=llm_eval --cov-report=xml --cov-report=term-missing --cov-fail-under=80
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

  pip-install:
    name: Verify Pip Installability
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Test pip install
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        echo "✅ Package installs successfully via pip"
    
    - name: Verify CLI tool works after pip install
      run: |
        llm-eval --help
        echo "✅ CLI accessible via pip installation"

  evaluation:
    name: Run Evaluation
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: |
        poetry install
    
    - name: Download NLTK data
      run: |
        poetry run python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab')"
    
    - name: Run evaluation
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        poetry run python -m llm_eval.cli --config examples/config.yaml --benchmark benchmarks/single_item_benchmark.jsonl --output-dir results/ --max-workers 1
    
    - name: Upload evaluation results
      uses: actions/upload-artifact@v4
      with:
        name: evaluation-results
        path: |
          results/
        retention-days: 30
    
    - name: Validate evaluation outputs
      run: |
        echo "Validating evaluation outputs..."
        
        # Check JSON report exists and is valid
        if [ ! -f results/results.json ]; then
          echo "❌ Evaluation failed: results.json not generated"
          exit 1
        fi
        echo "✅ JSON report found"
        
        # Validate JSON is parseable
        if ! python -m json.tool results/results.json > /dev/null 2>&1; then
          echo "❌ Invalid JSON format in results.json"
          exit 1
        fi
        echo "✅ JSON report is valid"
        
        # Check Markdown report exists
        if [ ! -f results/results.md ]; then
          echo "❌ Markdown report not generated"
          exit 1
        fi
        echo "✅ Markdown report found"
        
        # Check for visualization files
        png_count=$(find results -name "*.png" -type f | wc -l)
        if [ "$png_count" -eq 0 ]; then
          echo "❌ No visualization files (.png) generated"
          exit 1
        fi
        echo "✅ Found $png_count visualization file(s)"
        
        echo "✅ All evaluation outputs validated successfully"

  docker:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Install Docker Compose
      run: sudo apt-get update && sudo apt-get install -y docker-compose
    
    - name: Create .env file
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        echo "GROQ_API_KEY=$GROQ_API_KEY" > .env
        echo "OPENAI_API_KEY=" >> .env
    
    - name: Build Docker image
      run: |
        docker-compose build
    
    - name: Test Docker CLI accessibility
      run: |
        echo "Testing Docker build and CLI accessibility..."
        docker-compose run --rm llm-eval python -m llm_eval.cli --help
        echo "✅ Container built successfully and CLI is accessible"
    
    - name: Run full evaluation in Docker
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        echo "Running full evaluation inside Docker container..."
        docker-compose run --rm llm-eval python -m llm_eval.cli \
          --config examples/config.yaml \
          --benchmark benchmarks/single_item_benchmark.jsonl \
          --output-dir results/ \
          --max-workers 1
        echo "✅ Docker evaluation completed"
    
    - name: Validate Docker evaluation outputs
      run: |
        echo "Validating outputs from Docker evaluation..."
        
        # Check if results directory was created
        if [ ! -d results ]; then
          echo "❌ Results directory not created"
          exit 1
        fi
        
        # Validate outputs exist
        if [ ! -f results/results.json ]; then
          echo "❌ Docker evaluation did not generate results.json"
          exit 1
        fi
        
        echo "✅ Docker Compose evaluation verified successfully"
