name: LLM Evaluation Framework CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.13"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: |
        poetry install --with dev
    
    - name: Download NLTK data
      run: |
        poetry run python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab')"
    
    - name: Run linting
      run: |
        poetry run python -m pip install ruff
        poetry run ruff check src/ tests/ || true
    
    - name: Run tests with coverage
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        poetry run pytest tests/ --cov=llm_eval --cov-report=xml --cov-report=term-missing --cov-fail-under=80
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

  evaluation:
    name: Run Evaluation
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: |
        poetry install
    
    - name: Download NLTK data
      run: |
        poetry run python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab')"
    
    - name: Run evaluation
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        poetry run python -m llm_eval.cli --config examples/config.yaml --output-dir results/
    
    - name: Upload evaluation results
      uses: actions/upload-artifact@v4
      with:
        name: evaluation-results
        path: |
          results/
        retention-days: 30
    
    - name: Check for critical failures
      run: |
        if [ ! -f results/results.json ]; then
          echo "❌ Evaluation failed: results.json not generated"
          exit 1
        fi
        echo "✅ Evaluation completed successfully"

  docker:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Install Docker Compose
      run: sudo apt-get update && sudo apt-get install -y docker-compose
    
    - name: Create .env file
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        echo "GROQ_API_KEY=$GROQ_API_KEY" > .env
        echo "OPENAI_API_KEY=" >> .env
    
    - name: Build Docker image
      run: |
        docker-compose build
    
    - name: Test Docker container
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        docker-compose up -d
        sleep 10
        docker-compose ps
        docker-compose exec -T llm-eval python -c "import llm_eval; print('✅ Container working')"
        docker-compose down
