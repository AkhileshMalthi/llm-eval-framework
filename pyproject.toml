[tool.poetry]
name = "llm-eval-framework"
version = "0.1.0"
description = "A comprehensive framework for evaluating LLM responses with multiple metrics"
authors = ["Akhilesh Malthi <akhileshmalthi2299@gmail.com>"]
readme = "README.md"
packages = [{ include = "llm_eval", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.13,<3.15"
typer = ">=0.21.0,<0.22.0"
pydantic = ">=2.12.5,<3.0.0"
pyyaml = ">=6.0.3,<7.0.0"
pandas = ">=2.3.3,<3.0.0"
tqdm = ">=4.67.1,<5.0.0"
jinja2 = ">=3.1.6,<4.0.0"
matplotlib = ">=3.10.8,<4.0.0"
seaborn = ">=0.13.2,<0.14.0"
nltk = ">=3.9.2,<4.0.0"
rouge-score = ">=0.1.2,<0.2.0"
openai = ">=2.14.0,<3.0.0"
tenacity = ">=9.1.2,<10.0.0"
python-dotenv = ">=1.2.1,<2.0.0"
groq = ">=1.0.0,<2.0.0"
tabulate = ">=0.9.0,<0.10.0"
rich = ">=14.2.0,<15.0.0"
bert-score = ">=0.3.13,<0.4.0"
transformers = ">=4.57.3,<5.0.0"
torch = "^2.9.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.2,<10.0.0"
pytest-cov = ">=7.0.0,<8.0.0"

[tool.poetry.scripts]
llm-eval = "llm_eval.cli:app"

[build-system]
requires = ["poetry-core>=1.9.0,<2.0.0"]
build-backend = "poetry.core.masonry.api"
